<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goober Tutorials</title>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
}

button {
  margin: 4px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 14px;
}

#menu, #editor, #viewer {
  padding: 20px;
}

#scroll-container {
  height: calc(100vh - 80px);
  overflow-y: scroll;
  padding: 20px;
  box-sizing: border-box;
  scrollbar-width: none;
}

#scroll-container::-webkit-scrollbar {
  width: 0;
}

h1, h2 {
  text-align: left;
  margin: 20px 0;
}

div.step {
  margin-bottom: 5px;
}

.version {
  font-size: 14px;
  color: gray;
  margin-top: 10px;
}

.tutorial-btn {
  position: relative;
  display: inline-block;
  margin: 4px;
}

.delete-btn {
  color: white;
  background: red;
  border: none;
  padding: 2px 5px;
  cursor: pointer;
  font-weight: bold;
  margin-left: 4px;
}

#lines-preview {
  margin-top: 15px;
  margin-bottom: 15px;
}

.preview-line {
  margin: 3px 0;
}
</style>
</head>

<body>

<!-- ===== Menu ===== -->

<div id="menu">
  <h1>Goober Tutorials</h1>

  <div id="tutorial-buttons"></div>

  <button id="create-btn">Create Custom</button>
  <button id="reset-btn">Reset All</button>
</div>


<!-- ===== Editor ===== -->

<div id="editor" style="display:none;">

  <h2>Create/Edit Tutorial</h2>

  <input
    type="text"
    id="title-input"
    placeholder="Tutorial Title"
  >

  <br>

  <input
    type="text"
    id="line-input"
    placeholder="Line text"
  >

  <button id="add-line">Add Line</button>

  <div id="lines-preview"></div>

  <button id="save-tutorial">Save Tutorial</button>
  <button id="back-menu">Back to Menu</button>
</div>


<!-- ===== Viewer ===== -->

<div id="viewer" style="display:none;">

  <div id="scroll-container"></div>

  <button id="viewer-back">Back to Menu</button>
</div>


<script>

// ===== Storage =====

let tutorials;

try {
  tutorials = JSON.parse(
    localStorage.getItem("tutorials") || "{}"
  );
} catch {
  tutorials = {};
}


// ===== Variables =====

let currentTutorial = "";
let stepNumber = 1;
let editingLines = [];
let editingTitle = "";


// ===== Default Tutorial =====

const defaultGoober = [
  "be a goober",
  "goober around",
  "just goob",
  "try goobin",
  "if it doesn't work, goob again",
  "goober",
  "uh, is that it, WAIT NO i forgot theres more",
  "goummberbrrrrrrrrrtrr",
  "goobrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr",
  "becoem paankae",
  "goob gob goob goobbberrrr",
  "write a essay on what it is to be a goober",
  "make stupid code like this",
  "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaah",
  "wait no dont do any of what i said before, continue with the following steps instead",
  "...your on step... arent you, well be a goober",
  "idk",
  "be be be be be a goober",
  "aargaga"
];


// ===== Make Sure Default Tutorial Exists =====

if (
  !tutorials["Goober Tutorial"] ||
  !Array.isArray(tutorials["Goober Tutorial"]) ||
  tutorials["Goober Tutorial"].length === 0
) {
  tutorials["Goober Tutorial"] = [...defaultGoober];

  localStorage.setItem(
    "tutorials",
    JSON.stringify(tutorials)
  );
}


// ===== Elements =====

const menu =
  document.getElementById("menu");

const tutorialButtonsDiv =
  document.getElementById("tutorial-buttons");

const editor =
  document.getElementById("editor");

const viewer =
  document.getElementById("viewer");

const linesPreview =
  document.getElementById("lines-preview");

const titleInput =
  document.getElementById("title-input");

const lineInput =
  document.getElementById("line-input");

const scrollContainer =
  document.getElementById("scroll-container");


// ===== Screen Switching =====

function showMenu() {
  menu.style.display = "block";
  editor.style.display = "none";
  viewer.style.display = "none";
}

function showEditor() {
  menu.style.display = "none";
  editor.style.display = "block";
  viewer.style.display = "none";
}

function showViewer() {
  menu.style.display = "none";
  editor.style.display = "none";
  viewer.style.display = "block";
}


// ===== Save Storage =====

function saveTutorials() {
  localStorage.setItem(
    "tutorials",
    JSON.stringify(tutorials)
  );
}


// ===== Menu =====

function refreshMenu() {

  tutorialButtonsDiv.innerHTML = "";

  const names = Object.keys(tutorials);

  for (const key of names) {

    const wrapper =
      document.createElement("div");

    wrapper.className = "tutorial-btn";


    // Tutorial button

    const btn =
      document.createElement("button");

    btn.textContent = key;

    btn.addEventListener("click", function() {
      openTutorial(key);
    });


    // Right click = edit

    btn.addEventListener("contextmenu", function(e) {

      e.preventDefault();

      openEditor(key);
    });


    // Delete button

    const del =
      document.createElement("button");

    del.textContent = "✖";
    del.className = "delete-btn";

    del.addEventListener("click", function(e) {

      e.stopPropagation();

      if (key === "Goober Tutorial") {

        alert("You can't delete the main Goober Tutorial!");

        return;
      }

      if (
        confirm(
          `Delete tutorial "${key}"?`
        )
      ) {

        delete tutorials[key];

        saveTutorials();

        refreshMenu();
      }
    });


    wrapper.appendChild(btn);
    wrapper.appendChild(del);

    tutorialButtonsDiv.appendChild(wrapper);
  }
}


refreshMenu();


// ===== Editor =====

function openEditor(title) {

  showEditor();

  editingTitle = title;

  if (title && tutorials[title]) {
    editingLines = [...tutorials[title]];
    titleInput.value = title;
  } else {
    editingLines = [];
    titleInput.value = "";
  }

  lineInput.value = "";

  renderLinesPreview();
}


function renderLinesPreview() {

  linesPreview.innerHTML = "";

  editingLines.forEach(function(line, index) {

    const div =
      document.createElement("div");

    div.className = "preview-line";

    div.textContent =
      `${index + 1}. ${line}`;

    linesPreview.appendChild(div);
  });
}


// ===== Add Line =====

document
  .getElementById("add-line")
  .addEventListener("click", function() {

    const text =
      lineInput.value.trim();

    if (!text) {
      return;
    }

    editingLines.push(text);

    lineInput.value = "";

    renderLinesPreview();

    lineInput.focus();
  });


// Enter also adds a line

lineInput.addEventListener("keydown", function(e) {

  if (e.key === "Enter") {

    e.preventDefault();

    document
      .getElementById("add-line")
      .click();
  }
});


// ===== Save Tutorial =====

document
  .getElementById("save-tutorial")
  .addEventListener("click", function() {

    const title =
      titleInput.value.trim() || "Untitled";


    if (editingLines.length === 0) {

      alert("Must have at least 1 line!");

      return;
    }


    // Don't allow duplicate titles
    // when renaming

    if (
      editingTitle &&
      editingTitle !== title &&
      tutorials[editingTitle]
    ) {

      delete tutorials[editingTitle];
    }


    tutorials[title] =
      [...editingLines];

    saveTutorials();

    refreshMenu();

    openTutorial(title);
  });


// ===== Viewer =====

function addSteps(amount) {

  if (!currentTutorial) {
    return;
  }


  const lines =
    tutorials[currentTutorial];


  if (
    !Array.isArray(lines) ||
    lines.length === 0
  ) {
    return;
  }


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const div =
      document.createElement("div");

    div.className = "step";


    const randomIndex =
      Math.floor(
        Math.random() * lines.length
      );


    const randomLine =
      lines[randomIndex];


    div.textContent =
      `Step ${stepNumber}: ${randomLine}`;


    scrollContainer.appendChild(div);

    stepNumber++;
  }
}


function openTutorial(title) {

  if (
    !tutorials[title] ||
    !Array.isArray(tutorials[title]) ||
    tutorials[title].length === 0
  ) {
    return;
  }


  currentTutorial = title;

  stepNumber = 1;


  scrollContainer.innerHTML = "";


  const titleElement =
    document.createElement("h1");

  titleElement.textContent = title;

  scrollContainer.appendChild(
    titleElement
  );


  // Generate first 50 steps

  addSteps(50);


  showViewer();


  // Make sure we're at the top

  scrollContainer.scrollTop = 0;
}


// ===== Infinite Scrolling =====

scrollContainer.addEventListener(
  "scroll",
  function() {

    if (
      scrollContainer.scrollTop +
      scrollContainer.clientHeight >=
      scrollContainer.scrollHeight - 50
    ) {

      addSteps(10);
    }
  }
);


// ===== Create Custom =====

document
  .getElementById("create-btn")
  .addEventListener("click", function() {

    editingTitle = "";

    editingLines = [];

    titleInput.value = "";
    lineInput.value = "";

    renderLinesPreview();

    showEditor();
  });


// ===== Reset =====

document
  .getElementById("reset-btn")
  .addEventListener("click", function() {

    if (
      confirm(
        "Reset all tutorials to default?"
      )
    ) {

      tutorials = {
        "Goober Tutorial": [
          ...defaultGoober
        ]
      };

      saveTutorials();

      currentTutorial = "";

      refreshMenu();

      showMenu();
    }
  });


// ===== Editor Back =====

document
  .getElementById("back-menu")
  .addEventListener("click", function() {

    showMenu();
  });


// ===== Viewer Back =====

document
  .getElementById("viewer-back")
  .addEventListener("click", function() {

    currentTutorial = "";

    showMenu();
  });

</script>

</body>
</html>
